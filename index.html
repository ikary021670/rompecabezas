<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rompecabezas</title>
  
  <link rel="icon" type="image/png" href="./img/favicon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#007bff">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rompecabezas">
</head>
<body>

  <h1>Rompecabezas</h1>

  <div class="controls">
    <button id="btn-shuffle">Reiniciar / Mezclar</button>
    <button id="btn-upload">Cargar Imagen</button>
    <input type="file" id="img-input" accept="image/*" style="display: none;">
  </div>

  <div class="info">Movimientos: <span id="moves">0</span></div>

  <div id="board"></div>

  <div id="win-message">🎉 ¡Felicidades! ¡Completaste el rompecabezas!</div>

  <script src="app.js"></script>
</body>
</html>
