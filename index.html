<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Rompecabezas</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#007bff">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rompecabezas">
</head>
<body>

  <header>
    <h1>Rompecabezas</h1>
    <div class="controls">
      <button id="btn-shuffle">Reiniciar</button>
      <button id="btn-upload">Cargar Imagen</button>
      <input type="file" id="img-input" accept="image/*" style="display: none;">
    </div>
    <div class="info">Movimientos: <span id="moves">0</span></div>
  </header>

  <main class="game-container">
    <!-- Vista previa reducida arriba -->
    <div class="preview-container">
      <span>Guía:</span>
      <img id="preview-img" src="" alt="Vista previa">
    </div>

    <!-- Tablero central -->
    <div id="board"></div>

    <!-- Banner horizontal de piezas (Scroll horizontal) -->
    <div class="pieces-banner">
      <div id="pieces-container"></div>
    </div>
  </main>

  <div id="win-message">🎉 ¡Felicidades! ¡Completaste el rompecabezas!</div>

  <script src="app.js"></script>
</body>
</html>
