<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Rompecabezas</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#007bff">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rompecabezas">
</head>
<body>

  <!-- Barra de control compacta superior (Todo en 1 fila) -->
  <header class="top-bar">
    <div class="guide-box">
      <img id="preview-img" src="" alt="Guía" title="Guía de la imagen">
    </div>

    <div class="moves-badge">
      <span>Movs:</span> <strong id="moves">0</strong>
    </div>

  <div class="actions">
    <button id="btn-toggle-numbers" title="Mostrar/Ocultar Números" aria-label="Números">🔢</button>
    <button id="btn-shuffle" title="Reiniciar juego" aria-label="Reiniciar">🔄</button>
    <button id="btn-upload" title="Cargar nueva imagen" aria-label="Subir Imagen">📁</button>
    <input type="file" id="img-input" accept="image/*" style="display: none;">
  </div>
  </header>

  <main class="game-container">
    <!-- Tablero principal -->
    <div id="board"></div>

    <!-- Banner horizontal de piezas desordenadas -->
    <div class="pieces-banner">
      <div id="pieces-container"></div>
    </div>
  </main>

  <div id="win-message">🎉 ¡Felicidades! ¡Lo completaste!</div>

  <script src="app.js"></script>
</body>
</html>
