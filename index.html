<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Rompecabezas</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#007bff">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rompecabezas">
</head>
<body>

  <header class="top-bar">
    <div class="guide-box">
      <!-- 1 y 2. Imagen guía más grande con clic para Zoom -->
      <img id="preview-img" src="" alt="Guía" title="Toca para ampliar">
    </div>

    <select id="difficulty-select" title="Seleccionar dificultad">
      <option value="2">Fácil (4)</option>
      <option value="3" selected>Medio (9)</option>
      <option value="4">Difícil (16)</option>
    </select>

    <div class="moves-badge">
      <span>Movs:</span> <strong id="moves">0</strong>
    </div>

    <div class="actions">
      <button id="btn-shuffle" title="Reiniciar juego" aria-label="Reiniciar">🔄</button>
      <button id="btn-upload" title="Cargar nueva imagen" aria-label="Subir Imagen">📁</button>
      <input type="file" id="img-input" accept="image/*" style="display: none;">
    </div>
  </header>

  <main class="game-container">
    <div id="board"></div>

    <div class="pieces-banner">
      <div id="pieces-container"></div>
    </div>
  </main>

  <!-- 4. Contenedor dinámico de estado (Éxito / Error) -->
  <div id="status-message" class="status-badge"></div>

  <!-- 2. Modal de Zoom para la Imagen Guía -->
  <div id="image-modal" class="modal-overlay">
    <img id="modal-img" class="modal-content" src="" alt="Imagen ampliada">
  </div>

  <script src="app.js"></script>
</body>
</html>
